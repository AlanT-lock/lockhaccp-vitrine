    <!-- Google tag (gtag.js) : campagne Google Ads (remarketing). Les conversions passent
         par Google Tag Manager : voir src/lib/conversions.ts.
         Pas de fenêtre cookies : le suivi est actif pour tous les visiteurs (Consent Mode v2
         réglé sur « accordé »). La balise Google Ads (script de ~170 Ko) est configurée tout de
         suite et chargée une fois la page affichée.
         Placé avant Google Tag Manager pour que les balises GTM reçoivent aussi ce réglage. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', {
        ad_storage: 'granted',
        ad_user_data: 'granted',
        ad_personalization: 'granted',
        analytics_storage: 'granted'
      });
      // Tout de suite, pour que les conversions passent après la configuration.
      gtag('js', new Date());
      gtag('config', 'AW-18490045299');
      (function () {
        // La balise relève le clic sur l'annonce (gclid…) dans l'adresse de la page. Si le
        // visiteur a changé de page avant qu'elle soit chargée, il n'y est plus : on le remet le
        // temps qu'elle le lise (adresse d'arrivée gardée en mémoire seulement), sinon les
        // conversions ne sont pas rattachées à l'annonce.
        var rechercheArrivee = location.search;
        function remettreClicDansAdresse() {
          var arrivee = new URLSearchParams(rechercheArrivee);
          var cle = ['gclid', 'gbraid', 'wbraid'].filter(function (k) { return arrivee.get(k); })[0];
          if (!cle || new URLSearchParams(location.search).get(cle)) return null;
          var actuelle = location.pathname + location.search + location.hash;
          var u = new URL(location.href);
          u.searchParams.set(cle, arrivee.get(cle));
          var modifiee = u.pathname + u.search + u.hash;
          history.replaceState(history.state, '', modifiee);
          return function () {
            // Le visiteur a pu changer de page entre-temps : on ne touche plus à l'adresse.
            if (location.pathname + location.search + location.hash === modifiee) history.replaceState(history.state, '', actuelle);
          };
        }
        function charger() {
          var remettre = remettreClicDansAdresse();
          if (remettre) {
            gtag('event', 'lhc_balise_prete', { send_to: 'AW-18490045299', event_callback: remettre, event_timeout: 3000 });
            setTimeout(remettre, 6000); // balise bloquée (bloqueur de publicité) : on n'attend pas indéfiniment
          }
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=AW-18490045299';
          document.head.appendChild(s);
        }
        function apresAffichage() {
          if ('requestIdleCallback' in window) requestIdleCallback(charger, { timeout: 4000 });
          else setTimeout(charger, 1500);
        }
        if (document.readyState === 'complete') apresAffichage();
        else window.addEventListener('load', apresAffichage, { once: true });
      })();
    </script>
